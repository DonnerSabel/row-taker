[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "row-taker"
version = "0.1.0"
description = "Netzwerkfähiges Row-Taker-Unterrichtsprojekt mit CLI, Pygame-GUI und Bots."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pygame>=2.5",
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"row_taker.assets" = ["*.png", "cards/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_gui_final_cleanup.py" = ["E402"]
"tests/test_gui_game_visual_interaction.py" = ["E402"]
"tests/test_gui_visual_card_motion.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

